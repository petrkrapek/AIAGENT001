services:
  agent:
    build: .
    image: aiagent:latest
    env_file: .env
    # Forwards signals (docker stop, Ctrl+C) to the agent instead of Python running as PID 1.
    init: true
    stdin_open: true
    tty: true
    # The agent writes nothing to disk: read-only filesystem and bounded memory. No cap_drop or
    # no-new-privileges: on some hosts (AppArmor, container-based VPS) they make starting the
    # container fail with "exec /sbin/docker-init: operation not permitted". The agent runs as an
    # unprivileged user anyway (Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    # No volumes: profile, services and all data live in Airtable; configuration comes from .env.
