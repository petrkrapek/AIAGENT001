services:
  agent:
    build: .
    image: aiagent:latest
    env_file: .env
    stdin_open: true
    tty: true
    # Everything the agent stores goes to Airtable; only the profile is mounted (read-only).
    volumes:
      - type: bind
        source: ./profil.md
        target: /config/profil.md
        read_only: true
        bind:
          create_host_path: false
