name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes a running check.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The same runtime versions as the Docker image (requirements.lock) plus pinned dev tools.
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: mypy
      - run: pytest -q --cov=aiagent --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: docker build -t aiagent:ci .
      # As docker compose runs it: init, read-only filesystem with a writable /tmp, memory limit.
      - run: docker run --rm --init --read-only --tmpfs /tmp --memory 1g aiagent:ci --version
