name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes a running check.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # The same runtime versions as the Docker image (requirements.lock) plus pinned dev tools.
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: mypy
      - run: pytest -q --cov=aiagent --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t aiagent:ci .
      # As docker compose runs it: init, read-only filesystem with a writable /tmp, memory limit.
      - run: docker run --rm --init --read-only --tmpfs /tmp --memory 1g aiagent:ci --version
