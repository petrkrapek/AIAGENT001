[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiagent"
dynamic = ["version"]
description = "AI obchodník: vyhledává potenciální zákazníky a píše jim nabídky spolupráce (Claude API)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Petr Krapek" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Czech",
    "Environment :: Console",
    "Private :: Do Not Upload",
]
# Upper bounds: a new major SDK version may change the API this agent relies on.
dependencies = [
    "anthropic>=1.13,<2",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
aiagent = "aiagent.cli:main"

[project.urls]
Repository = "https://github.com/petrkrapek/AIAGENT001"

[tool.setuptools.dynamic]
version = { attr = "aiagent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["aiagent"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
