[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiagent"
version = "0.1.0"
description = "AI obchodník: vyhledává potenciální zákazníky a píše jim nabídky spolupráce (Claude API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aiagent = "aiagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
